<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="425" viewBox="0 0 1280 425" role="img" aria-labelledby="title desc" xml:lang="zh-Hant"><title id="title">正常輸出：USB 與 I2C/I2S</title><desc id="desc">音訊由左向右呈現；Far 是播放數位參考，Near 是處理前麥克風，Decode 是 AEC/NR 輸出。</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans CJK TC",Arial,sans-serif}</style><defs><marker id="arrow-Near" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#087f5b"/></marker><marker id="arrow-Far" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b95c00"/></marker><marker id="arrow-Decode" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#6741d9"/></marker><marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker></defs><rect width="1280" height="425" fill="white"/><text x="24" y="38" font-size="28" fill="#1e293b" text-anchor="start" font-weight="600">正常輸出：USB 與 I2C/I2S</text><rect x="360" y="75" width="520" height="230" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="620" y="108" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="600">u32Decode：Host 的左右聲道</text><polyline points="274,125 320,125 320,190 380,190" fill="none" stroke="#087f5b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-Near)"/><polyline points="274,275 745,275 745,250" fill="none" stroke="#6741d9" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-Decode)"/><polyline points="880,190 995,190" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><g class="node"><rect x="24" y="80" width="250" height="90" rx="12" fill="#e6fcf5" stroke="#087f5b" stroke-width="2.5"/><text x="149.0" y="117.0" font-size="24" fill="#087f5b" text-anchor="middle" font-weight="600">Near</text><text x="149.0" y="149.0" font-size="20" fill="#087f5b" text-anchor="middle" font-weight="400">麥克風原始混合收音</text></g><g class="node"><rect x="24" y="230" width="250" height="90" rx="12" fill="#f3f0ff" stroke="#6741d9" stroke-width="2.5"/><text x="149.0" y="267.0" font-size="24" fill="#6741d9" text-anchor="middle" font-weight="600">Decode</text><text x="149.0" y="299.0" font-size="20" fill="#6741d9" text-anchor="middle" font-weight="400">AEC / NR 處理後</text></g><g class="node"><rect x="380" y="135" width="230" height="115" rx="12" fill="#e6fcf5" stroke="#087f5b" stroke-width="2.5"/><text x="495.0" y="168.5" font-size="24" fill="#087f5b" text-anchor="middle" font-weight="600">左 Left</text><text x="495.0" y="200.5" font-size="26" fill="#087f5b" text-anchor="middle" font-weight="400">Near</text><text x="495.0" y="232.5" font-size="18" fill="#087f5b" text-anchor="middle" font-weight="400">低 16 bits</text></g><g class="node"><rect x="630" y="135" width="230" height="115" rx="12" fill="#f3f0ff" stroke="#6741d9" stroke-width="2.5"/><text x="745.0" y="168.5" font-size="24" fill="#6741d9" text-anchor="middle" font-weight="600">右 Right</text><text x="745.0" y="200.5" font-size="26" fill="#6741d9" text-anchor="middle" font-weight="400">Decode</text><text x="745.0" y="232.5" font-size="18" fill="#6741d9" text-anchor="middle" font-weight="400">高 16 bits</text></g><rect x="995" y="100" width="260" height="190" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="1125" y="137" font-size="24" fill="#1e293b" text-anchor="middle" font-weight="600">Host 接收</text><text x="1125" y="170" font-size="20" fill="#1e293b" text-anchor="middle" font-weight="400">USB record / I2S host</text><text x="1125" y="223" font-size="24" fill="#087f5b" text-anchor="middle" font-weight="600">左：Near</text><text x="1125" y="260" font-size="24" fill="#6741d9" text-anchor="middle" font-weight="600">右：Decode</text><text x="24" y="360" font-size="20" fill="#1e293b" text-anchor="start" font-weight="400">低 16 bits 對應左聲道，高 16 bits 對應右聲道；I2C 正常模式為 0x13=1。</text><text x="24" y="398" font-size="20" fill="#1e293b" text-anchor="start" font-weight="400">USB 送至 PC 錄音；I2C/I2S 送至 embedded host。</text></svg>
