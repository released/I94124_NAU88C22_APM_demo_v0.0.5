<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc" xml:lang="zh-Hant"><title id="title">Far、Near 與 Decode 的訊號關係</title><desc id="desc">音訊由左向右呈現；Far 是播放數位參考，Near 是處理前麥克風，Decode 是 AEC/NR 輸出。</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans CJK TC",Arial,sans-serif}</style><defs><marker id="arrow-Near" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#087f5b"/></marker><marker id="arrow-Far" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b95c00"/></marker><marker id="arrow-Decode" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#6741d9"/></marker><marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker></defs><rect width="1280" height="540" fill="white"/><text x="24" y="38" font-size="28" fill="#1e293b" text-anchor="start" font-weight="600">Far、Near 與 Decode 的訊號關係</text><polyline points="244,119 300,119" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><polyline points="550,119 650,119" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/><polyline points="425,164 425,235" fill="none" stroke="#b95c00" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-Far)"/><polyline points="550,280 610,280 610,330 650,330" fill="none" stroke="#b95c00" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-Far)"/><polyline points="244,430 300,430" fill="none" stroke="#087f5b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-Near)"/><polyline points="550,430 610,430 610,380 650,380" fill="none" stroke="#087f5b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-Near)"/><polyline points="910,355 980,355" fill="none" stroke="#6741d9" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-Decode)"/><g class="node"><rect x="24" y="74" width="220" height="90" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="134.0" y="111.0" font-size="24" fill="#334155" text-anchor="middle" font-weight="600">Host 播放 PCM</text><text x="134.0" y="143.0" font-size="20" fill="#334155" text-anchor="middle" font-weight="400">USB / SPI2-I2S</text></g><g class="node"><rect x="300" y="74" width="250" height="90" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="425.0" y="111.0" font-size="24" fill="#334155" text-anchor="middle" font-weight="600">I2S0 TX buffer</text><text x="425.0" y="143.0" font-size="20" fill="#334155" text-anchor="middle" font-weight="400">準備送往 CODEC 播放</text></g><g class="node"><rect x="650" y="74" width="280" height="90" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="790.0" y="111.0" font-size="24" fill="#334155" text-anchor="middle" font-weight="600">CODEC DAC → 喇叭</text><text x="790.0" y="143.0" font-size="20" fill="#334155" text-anchor="middle" font-weight="400">播放音樂／新聞</text></g><text x="790" y="200" font-size="18" fill="#475569" text-anchor="middle" font-weight="400">播放聲可經聲學路徑回到麥克風</text><g class="node"><rect x="300" y="235" width="250" height="90" rx="12" fill="#fff4e6" stroke="#b95c00" stroke-width="2.5"/><text x="425.0" y="272.0" font-size="24" fill="#b95c00" text-anchor="middle" font-weight="600">Far（播放參考）</text><text x="425.0" y="304.0" font-size="20" fill="#b95c00" text-anchor="middle" font-weight="400">TX 低 16 bits</text></g><g class="node"><rect x="24" y="385" width="220" height="90" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="134.0" y="422.0" font-size="24" fill="#334155" text-anchor="middle" font-weight="600">麥克風 → ADC</text><text x="134.0" y="454.0" font-size="20" fill="#334155" text-anchor="middle" font-weight="400">人聲＋回音＋環境聲</text></g><g class="node"><rect x="300" y="385" width="250" height="90" rx="12" fill="#e6fcf5" stroke="#087f5b" stroke-width="2.5"/><text x="425.0" y="422.0" font-size="24" fill="#087f5b" text-anchor="middle" font-weight="600">Near（處理前）</text><text x="425.0" y="454.0" font-size="20" fill="#087f5b" text-anchor="middle" font-weight="400">RX 低 16 bits</text></g><g class="node"><rect x="650" y="300" width="260" height="110" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="780.0" y="347.0" font-size="24" fill="#334155" text-anchor="middle" font-weight="600">AEC / NR</text><text x="780.0" y="379.0" font-size="20" fill="#334155" text-anchor="middle" font-weight="400">Colsonic_apm_proc</text></g><g class="node"><rect x="980" y="310" width="270" height="90" rx="12" fill="#f3f0ff" stroke="#6741d9" stroke-width="2.5"/><text x="1115.0" y="347.0" font-size="24" fill="#6741d9" text-anchor="middle" font-weight="600">Decode（處理後）</text><text x="1115.0" y="379.0" font-size="20" fill="#6741d9" text-anchor="middle" font-weight="400">AEC / NR 輸出</text></g><text x="24" y="514" font-size="20" fill="#1e293b" text-anchor="start" font-weight="400">Near 與 Far 是 APM 輸入；Decode 是處理後結果。Far 為數位播放參考，並非另一支麥克風。</text></svg>
